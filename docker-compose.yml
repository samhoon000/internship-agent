version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: internship_db
    restart: always
    environment:
      POSTGRES_DB: internship
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internship"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internship_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: internship_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/internship
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - ADMIN_API_KEY=super-secret-admin-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: internship_worker
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=internship
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/internship
      - PLAYWRIGHT_HEADLESS=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db_backup:
    image: postgres:15-alpine
    container_name: internship_db_backup
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=internship
      - BACKUP_DIR=/backups
    volumes:
      - postgres_backups:/backups
    entrypoint: >
      /bin/sh -c "
      echo 'Starting backup service cron loop...';
      while true; do
        echo 'Creating database backup...';
        mkdir -p /backups;
        FILENAME='/backups/backup_$$(date +%Y-%m-%d_%H-%M-%S).sql';
        PGPASSWORD=$$DB_PASSWORD pg_dump -h $$DB_HOST -U $$DB_USER $$DB_NAME > $$FILENAME;
        gzip -f $$FILENAME;
        echo 'Backup created successfully.';
        echo 'Enforcing retention policy (older than 7 days)...';
        find /backups -name 'backup_*.sql.gz' -type f -mtime +7 -delete;
        echo 'Sleeping for 24 hours...';
        sleep 86400;
      done
      "
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: internship_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
