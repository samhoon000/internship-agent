version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: internship_db
    restart: always
    environment:
      MYSQL_DATABASE: internship
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internship_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: internship_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=internship
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - ADMIN_API_KEY=super-secret-admin-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: internship_worker
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=internship
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=mysql+pymysql://root:@db/internship
      - PLAYWRIGHT_HEADLESS=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db_backup:
    image: mysql:8.0
    container_name: internship_db_backup
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=internship
      - BACKUP_DIR=/backups
    volumes:
      - mysql_backups:/backups
    entrypoint: >
      /bin/sh -c "
      echo 'Starting backup service cron loop...';
      while true; do
        echo 'Creating database backup...';
        mkdir -p /backups;
        FILENAME='/backups/backup_$$(date +%Y-%m-%d_%H-%M-%S).sql';
        mysqldump -h $$DB_HOST -u $$DB_USER $$DB_NAME > $$FILENAME;
        gzip -f $$FILENAME;
        echo 'Backup created successfully.';
        echo 'Enforcing retention policy (older than 7 days)...';
        find /backups -name 'backup_*.sql.gz' -type f -mtime +7 -delete;
        echo 'Sleeping for 24 hours...';
        sleep 86400;
      done
      "
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: internship_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  mysql_backups:
